name: Automatically rebase "master" and all "tracking-" branches to latest upstream

on:
  schedule:
    - cron:  '1 * * * *'  # primary, every 1st minute of the hour
    - cron:  '20 * * * *' # fallback 1, every 20th minute
    - cron:  '40 */2 * * *' # fallback 2, every 40th minute of every 2nd hour
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rebase-master-and-all-tracking-branches:
    runs-on: ubuntu-latest
    steps:
      - name: Update master and all tracking branches
        uses: actions/checkout@v7
        with:
          path: gentoo
      - run: |
          gentoo/.github/workflows/rebase-to-upstream.sh
